<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flingo777 ~ portfolio</title>
<link rel="icon" href="https://avatars.githubusercontent.com/u/91720705?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #1a1b26;
    --bg-panel:  #16161e;
    --bg-title:  #1f2335;
    --line:      #292e42;
    --fg:        #c0caf5;
    --dim:       #565f89;
    --blue:      #7aa2f7;
    --purple:    #bb9af7;
    --cyan:      #7dcfff;
    --green:     #9ece6a;
    --yellow:    #e0af68;
    --orange:    #ff9e64;
    --red:       #f7768e;
  }

  *{box-sizing:border-box;}
  ::selection{background:var(--blue);color:var(--bg);}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    min-height:100vh;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 5vw 4vh;
  }

  /* ---------- header ---------- */
  .id{
    width:100%;
    max-width:880px;
    margin-bottom:28px;
    display:flex;
    align-items:center;
    gap:20px;
  }
  .id img{
    width:56px;
    height:56px;
    border-radius:8px;
    border:1px solid var(--line);
    filter:saturate(0.9);
  }
  .id h1{
    font-size:1.05rem;
    font-weight:700;
    margin:0;
    color:var(--fg);
    letter-spacing:0.3px;
  }
  .id p{
    margin:4px 0 0;
    font-size:0.85rem;
    color:var(--dim);
  }
  .id p .sep{color:var(--line); margin:0 8px;}
  .id p .accent{color:var(--purple);}

  /* ---------- terminal window ---------- */
  .term-wrap{
    width:100%;
    max-width:880px;
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-panel);
    border:1px solid var(--line);
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);
  }

  .titlebar{
    background:var(--bg-title);
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    user-select:none;
  }
  .dots{display:flex; gap:8px;}
  .dot{width:11px; height:11px; border-radius:50%;}
  .dot.r{background:#f7768e;}
  .dot.y{background:#e0af68;}
  .dot.g{background:#9ece6a;}
  .titlebar .name{
    font-size:0.75rem;
    color:var(--dim);
    letter-spacing:0.4px;
  }
  .titlebar .clock{
    font-size:0.75rem;
    color:var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .screen{
    padding:18px 20px 16px;
    height:56vh;
    min-height:420px;
    max-height:640px;
    overflow-y:auto;
    font-size:0.86rem;
    line-height:1.65;
  }
  .screen::-webkit-scrollbar{width:8px;}
  .screen::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .screen::-webkit-scrollbar-track{background:transparent;}

  .line{white-space:pre-wrap; word-break:break-word; opacity:0; animation:reveal 220ms ease forwards;}
  @keyframes reveal{ to{opacity:1;} }

  .prompt-row{display:flex; flex-wrap:wrap; gap:6px;}
  .p-user{color:var(--green);}
  .p-at{color:var(--dim);}
  .p-host{color:var(--cyan);}
  .p-path{color:var(--blue);}
  .p-sym{color:var(--dim); margin-right:2px;}
  .cmd-echo{color:var(--fg);}

  .muted{color:var(--dim);}
  .h{color:var(--blue);}
  .h2{color:var(--purple);}
  .ok{color:var(--green);}
  .warn{color:var(--yellow);}
  .link{color:var(--cyan); text-decoration:none; border-bottom:1px dotted var(--cyan);}
  .link:hover{color:var(--fg); border-bottom-color:var(--fg);}
  .tag{color:var(--orange);}
  .err{color:var(--red);}

  table.kv{border-collapse:collapse; margin:2px 0;}
  table.kv td{padding:1px 10px 1px 0; vertical-align:top;}
  table.kv td.k{color:var(--dim);}

  .bar-bg{color:var(--line);}
  .bar-fill{color:var(--purple);}

  /* ---------- input line ---------- */
  .input-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 20px 16px;
    border-top:1px solid var(--line);
  }
  .input-row .static-prompt{font-size:0.86rem; white-space:nowrap;}
  .input-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--fg);
    font-family:inherit;
    font-size:0.86rem;
    caret-color:var(--purple);
  }
  .input-row input::placeholder{color:var(--dim); opacity:0.7;}

  .cursor{
    display:inline-block;
    width:7px;
    height:15px;
    background:var(--purple);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }

  /* ---------- footer ---------- */
  .foot{
    width:100%;
    max-width:880px;
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
    font-size:0.72rem;
    color:var(--dim);
    flex-wrap:wrap;
    gap:6px;
  }
  .foot .keys kbd{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 6px;
    color:var(--fg);
    font-family:inherit;
    font-size:0.7rem;
  }

  @media (max-width:640px){
    .screen{height:50vh; min-height:340px;}
    .id img{width:46px; height:46px;}
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none; opacity:1;}
    .line{animation:none; opacity:1;}
  }
</style>
</head>
<body>

  <div class="id">
    <img src="https://avatars.githubusercontent.com/u/91720705?v=4" alt="flingo777 avatar">
    <div>
      <h1>flingo777</h1>
      <p>frontend developer <span class="sep">·</span> India <span class="sep">·</span> <span class="accent">breaking code</span></p>
    </div>
  </div>

  <div class="term-wrap">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="name">flingo@cachyos: ~</div>
      <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="screen" id="screen"></div>

    <div class="input-row">
      <span class="static-prompt">
        <span class="p-user">flingo</span><span class="p-at">@</span><span class="p-host">cachyos</span><span class="p-sym">:~$</span>
      </span>
      <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type 'help' and press enter">
      <span class="cursor" id="fakeCursor"></span>
    </div>
  </div>

  <div class="foot">
    <span class="keys"><kbd>tab</kbd> complete &nbsp; <kbd>↑</kbd> history &nbsp; <kbd>enter</kbd> run</span>
  </div>

<script>
(function(){
  const screen = document.getElementById('screen');
  const input  = document.getElementById('cmdInput');
  const clockEl = document.getElementById('clock');

  /* ---------------- clock ---------------- */
  function tick(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- helpers ---------------- */
  function append(html){
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = html;
    screen.appendChild(div);
    screen.scrollTop = screen.scrollHeight;
    return div;
  }

  function promptEcho(cmd){
    append(`<div class="prompt-row"><span class="p-user">flingo</span><span class="p-at">@</span><span class="p-host">cachyos</span><span class="p-sym">:~$</span><span class="cmd-echo">&nbsp;${escapeHtml(cmd)}</span></div>`);
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function bar(pct, width=20){
    const filled = Math.round((pct/100)*width);
    return `<span class="bar-fill">${'█'.repeat(filled)}</span><span class="bar-bg">${'░'.repeat(width-filled)}</span>`;
  }

  /* ---------------- command outputs ---------------- */
  const banner = `
<span class="muted">flingo777 — frontend dev, breaking Linux setups on purpose</span>
<span class="muted">type <span class="ok">help</span> to see available commands</span>
`;

  const commands = {

    help: () => `
<span class="h">available commands</span>

  <span class="ok">whoami</span>         quick identity
  <span class="ok">about</span>          more about me
  <span class="ok">tech</span>           stack
  <span class="ok">projects</span>       pinned repositories
  <span class="ok">socials</span>        where to find me
  <span class="ok">contact</span>        get in touch
  <span class="ok">fastfetch</span>      system info
  <span class="ok">clear</span>          clear the screen
`,

    whoami: () => `
<table class="kv">
  <tr><td class="k">handle</td><td>flingo777</td></tr>
  <tr><td class="k">role</td><td>Frontend Developer</td></tr>
  <tr><td class="k">focus</td><td>clean interfaces, breaking Linux setups on purpose</td></tr>
  <tr><td class="k">currently</td><td>learning cs core</td></tr>
  <tr><td class="k">based_in</td><td>India <span class="muted">(UTC +05:30)</span></td></tr>
</table>
`,

    about: () => `
Computer science student and tech enthusiast. Spent a couple of years on
frontend projects, now shifting focus toward backend and Linux internals.

<span class="muted">building</span>   <span class="tag">animedlr</span> — an anime recommendation hub based on your taste
<span class="muted">learning</span>   backend fundamentals, Linux
<span class="muted">ask me about</span>  React, Linux, or your anime backlog
`,

    tech: () => `
<span class="h">languages</span>
  JavaScript · HTML · CSS · Python

<span class="h">frameworks / libraries</span>
  React · Next.js · Tailwind CSS · Vite · Node.js

<span class="h">developer tools</span>
  Git · GitHub · Docker · Linux · npm

`,

    projects: () => `
<span class="h">pinned repositories</span>  <span class="muted">(25 public total)</span>

  <a class="link" href="https://github.com/flingo777/timecouncil" target="_blank">timecouncil</a>
    <span class="muted">Time Travel Files</span> · JavaScript · ★ 1

  <a class="link" href="https://github.com/flingo777/giphy-search-engine" target="_blank">giphy-search-engine</a>
    <span class="muted">a simple gif search engine built on the Giphy API</span> · JavaScript · ★ 1

  <a class="link" href="https://github.com/flingo777/space" target="_blank">space</a>
    <span class="muted">CSS experiment</span> · CSS · ★ 2

<span class="muted">→ full list: </span><a class="link" href="https://github.com/flingo777?tab=repositories" target="_blank">github.com/flingo777?tab=repositories</a>
`,

    socials: () => `
<span class="h">find me</span>

  github    <a class="link" href="https://github.com/flingo777" target="_blank">flingo777</a>
  x         <a class="link" href="https://x.com/zenshi07" target="_blank">@zenshi07</a>
  discord   <a class="link" href="https://discord.gg/users/867603695641165856" target="_blank">zenshi07</a>
  email     <a class="link" href="mailto:flingo_07@proton.me">flingo_07@proton.me</a>
`,

    contact: () => `
<span class="h">get in touch</span>

  reach me fastest by <a class="link" href="mailto:flingo_07@proton.me">email</a>
  or say hi on <a class="link" href="https://x.com/zenshi07" target="_blank">x</a> / <a class="link" href="https://discord.gg/FAuvbMPNrA" target="_blank">discord</a>

<span class="muted">➜ ~ thanks for stopping by</span>
`,

  fastfetch: () => `
<div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

  <img
    src="./reze.png"
    alt="Reze"
    style="height:220px; border-radius:8px;"
  />

  <table class="kv">
    <tr><td class="k">flingo</td><td>@cachyos</td></tr>
    <tr><td colspan="2"><span class="muted">-----------------</span></td></tr>
    <tr><td class="k">os</td><td>CachyOS</td></tr>
    <tr><td class="k">wm</td><td>Niri</td></tr>
    <tr><td class="k">shell</td><td>fish</td></tr>
    <tr><td class="k">terminal</td><td>kitty</td></tr>
    <tr><td class="k">editor</td><td>Neovim / VS Code</td></tr>
    <tr><td class="k">uptime</td><td>probably too long</td></tr>
  </table>

</div>

`,

    clear: () => null,
  };

  /* ---------------- instant load sequence ---------------- */
  append(banner);
  input.focus();

  /* ---------------- input handling ---------------- */
  const history = [];
  let hIdx = -1;

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      const raw = input.value;
      const cmd = raw.trim().toLowerCase();
      if(raw.trim() !== ''){ history.push(raw); }
      hIdx = history.length;
      promptEcho(raw);
      input.value = '';

      if(cmd === ''){ return; }

      if(cmd === 'clear'){
        screen.innerHTML = '';
        return;
      }

      if(commands.hasOwnProperty(cmd)){
        append(commands[cmd]());
      } else {
        append(`<span class="err">command not found:</span> ${escapeHtml(cmd)}  <span class="muted">— try 'help'</span>`);
      }
    }
    else if(e.key === 'Tab'){
      e.preventDefault();
      const partial = input.value.trim().toLowerCase();
      if(!partial) return;
      const match = Object.keys(commands).find(k => k.startsWith(partial));
      if(match){ input.value = match; }
    }
    else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(history.length === 0) return;
      hIdx = Math.max(0, hIdx-1);
      input.value = history[hIdx] || '';
    }
    else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(history.length === 0) return;
      hIdx = Math.min(history.length, hIdx+1);
      input.value = history[hIdx] || '';
    }
  });

  screen.addEventListener('click', () => input.focus());
  document.body.addEventListener('click', (e) => {
    if(!e.target.closest('a')) input.focus();
  });

})();
</script>
</body>
</html>
